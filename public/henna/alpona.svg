<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round">
  <!-- a floor alpona: dotted rings and a wreath of petals around the centre. Used as a CSS mask on the head of a
       family's biodata card (globals.css), centred where the card's foot is, so the upper half shows. -->
  <circle cx="120" cy="120" r="58" stroke-width="3" stroke-dasharray="0 7.6"/>
  <circle cx="120" cy="120" r="74"/>
  <ellipse cx="120" cy="37" rx="5" ry="10"/>
  <ellipse cx="120" cy="37" rx="5" ry="10" transform="rotate(30 120 120)"/>
  <ellipse cx="120" cy="37" rx="5" ry="10" transform="rotate(60 120 120)"/>
  <ellipse cx="120" cy="37" rx="5" ry="10" transform="rotate(90 120 120)"/>
  <ellipse cx="120" cy="37" rx="5" ry="10" transform="rotate(120 120 120)"/>
  <ellipse cx="120" cy="37" rx="5" ry="10" transform="rotate(150 120 120)"/>
  <ellipse cx="120" cy="37" rx="5" ry="10" transform="rotate(180 120 120)"/>
  <ellipse cx="120" cy="37" rx="5" ry="10" transform="rotate(210 120 120)"/>
  <ellipse cx="120" cy="37" rx="5" ry="10" transform="rotate(240 120 120)"/>
  <ellipse cx="120" cy="37" rx="5" ry="10" transform="rotate(270 120 120)"/>
  <ellipse cx="120" cy="37" rx="5" ry="10" transform="rotate(300 120 120)"/>
  <ellipse cx="120" cy="37" rx="5" ry="10" transform="rotate(330 120 120)"/>
  <circle cx="120" cy="120" r="92" stroke-width="3" stroke-dasharray="0 9"/>
  <circle cx="120" cy="120" r="104" stroke-width="2.4" stroke-dasharray="0 13.6" opacity="0.7"/>
  <circle cx="120" cy="120" r="114" opacity="0.5"/>
</svg>
