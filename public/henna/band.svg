<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 14" fill="none" stroke="#000" stroke-width="1" stroke-linecap="round">
  <!-- the lattice band from a wrist: two lines, a criss-cross between them, a dot at every crossing. Used as a CSS mask, so only its shape matters. -->
  <path d="M0 1.5 H80 M0 12.5 H80"/>
  <path d="M0 1.5 L10 12.5 L20 1.5 L30 12.5 L40 1.5 L50 12.5 L60 1.5 L70 12.5 L80 1.5"/>
  <path d="M0 12.5 L10 1.5 L20 12.5 L30 1.5 L40 12.5 L50 1.5 L60 12.5 L70 1.5 L80 12.5"/>
  <g fill="#000" stroke="none">
    <circle cx="5" cy="7" r="1.4"/><circle cx="15" cy="7" r="1.4"/><circle cx="25" cy="7" r="1.4"/><circle cx="35" cy="7" r="1.4"/>
    <circle cx="45" cy="7" r="1.4"/><circle cx="55" cy="7" r="1.4"/><circle cx="65" cy="7" r="1.4"/><circle cx="75" cy="7" r="1.4"/>
  </g>
</svg>
